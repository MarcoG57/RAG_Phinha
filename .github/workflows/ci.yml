name: Delivery checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: CPU tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/checkout@v4
        with:
          repository: metrica-sports/more-than-a-hack-2027
          ref: f8f2629ff1e0985f81d7e59d8413678514ee1530
          path: .official
          persist-credentials: false
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.lock.txt
      - name: Check delivery integrity
        run: python scripts/check_repo.py --tracked
      - name: Test training, evaluation and inference with synthetic inputs
        run: python -m unittest discover -s tests -v
